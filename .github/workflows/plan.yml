name: Plan

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write       # OIDC authentication
  contents: read        # Read repository
  pull-requests: write  # Comment on PRs

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  terraform_plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install Lambda Dependencies
        run: npm install
        working-directory: ./lambda

      - name: Build Lambda
        run: npm run build
        working-directory: ./lambda

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::786401692952:role/GitHubActionsTerraform
          aws-region: us-east-1
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
      
      - name: Init Terraform
        run: terraform init -no-color
        working-directory: ./terraform

      - name: Validate Terraform
        run: terraform validate -no-color
        working-directory: ./terraform
      
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ./terraform
        continue-on-error: true

      - name: Fail on Failed Plan
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Comment Plan on PR
        uses: mshick/add-pr-comment@v3
        with:
          message-path: tfplan 

  publish_plan:
    name: Publish Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::786401692952:role/GitHubActionsPagePublishing
          aws-region: us-east-1

      - name: Setup script dependencies
        run: npm install
        working-directory: ./actions-scripts/detect-changes

      - name: Identify Logs To Be Published
        run: npx tsx actions-scripts/detect-changes/src/index.ts ./site/src/content/logs publish-plan.json

      - name: Comment Plan on PR
        uses: mshick/add-pr-comment@v3
        with:
          message-path: publish-plan.json 